<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b8f9b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SSW Gestão">
<title>SSW Gestão</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{--teal:#0b8f9b;--ink:#263238;--muted:#5f7175}
  html,body{margin:0;min-height:100%;background:#fff;font:15px/1.5 Roboto,Arial,sans-serif;color:var(--ink)}
  main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  img{width:240px;max-width:70%}
  h1{font-size:1.15rem;color:var(--teal);margin:14px 0 6px}
  p{color:var(--muted);max-width:440px;margin:6px auto}
  input{width:100%;max-width:440px;box-sizing:border-box;border:1px solid #d3e3e5;border-radius:6px;padding:10px;font:inherit;margin:10px 0}
  .btn{display:inline-block;background:var(--teal);color:#fff;border:0;border-radius:6px;padding:10px 18px;font:inherit;text-decoration:none;cursor:pointer;margin:4px}
  .btn.sec{background:#fff;color:var(--teal);border:1px solid var(--teal)}
  .hidden{display:none}
  .barra{height:3px;width:180px;margin:16px auto 0;background:linear-gradient(90deg,var(--teal) 35%,#e3f4f5 35%);background-size:200% 100%;animation:c 1s linear infinite;border-radius:2px}
  @keyframes c{to{background-position:-200% 0}}
  small{color:var(--muted)}
</style>
</head>
<body>
<main>
  <div id="abrindo">
    <img src="logo.svg" alt="SSW Segurança e Medicina do Trabalho">
    <div class="barra" aria-hidden="true"></div>
    <p id="msg">Abrindo o SSW Gestão…</p>
    <p class="hidden" id="ajuda"><a class="btn" id="abrir">Abrir o sistema</a><br><a href="?configurar" class="btn sec">Trocar o endereço do sistema</a></p>
  </div>
  <div id="config" class="hidden">
    <img src="logo.svg" alt="SSW">
    <h1>Configurar o SSW Gestão</h1>
    <p>Cole o endereço do sistema (o link do app da Web, que termina em <b>/exec</b>). Isso é feito só uma vez em cada computador ou celular.</p>
    <input id="url" type="url" placeholder="https://script.google.com/a/macros/sswmedicinadotrabalho.com.br/s/…/exec">
    <br><button class="btn" type="button" id="salvar">Salvar e abrir</button>
    <p><small>Antes, entre no Chrome com o seu e-mail @sswmedicinadotrabalho.com.br.</small></p>
  </div>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
  var url="";try{url=localStorage.getItem("ssw_app_url")||""}catch(e){}
  var valido=function(u){return /^https:\/\/script\.google\.com\/.+\/exec(\?.*)?$/.test(u)};
  if(location.search.indexOf("configurar")>=0||!valido(url)){
    $("abrindo").classList.add("hidden");$("config").classList.remove("hidden");
    if(url)$("url").value=url;
    $("salvar").onclick=function(){var v=$("url").value.trim();if(!valido(v)){alert("Esse não parece o link do sistema. Ele começa com https://script.google.com e termina em /exec.");return}
      try{localStorage.setItem("ssw_app_url",v)}catch(e){}location.replace(v)};
    return;
  }
  if(!navigator.onLine){$("msg").textContent="Sem conexão com a internet. O SSW Gestão precisa de internet para funcionar.";return}
  $("abrir").href=url;
  setTimeout(function(){$("ajuda").classList.remove("hidden")},4000);
  location.replace(url);
})();
</script>
</body>
</html>
